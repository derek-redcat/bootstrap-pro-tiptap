packages:
  - examples

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  json-editor-vue: true
  simple-git-hooks: true
  vue-demi: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - json-editor-vue
  - simple-git-hooks
  - unrs-resolver
  - vue-demi

# Moved from .npmrc: pnpm 10+ only reads pnpm-specific settings from this file
strictPeerDependencies: false

publicHoistPattern:
  - '*types*'
  - '*eslint*'
  - '*prettier*'
  - '@vue*'
  - '@semantic-release/*'
  - '@commitlint/*'
  - '*stylelint*'
  - 'postcss*'
  - tslib
  - '@tiptap/*'
  - 'prosemirror*'
